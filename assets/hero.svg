<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Andrés Zapata — Software Architect &amp; AI Engineer</title>
  <desc id="desc">10+ years building mission-critical platforms for Fintech and Insurtech, 200+ people led, working across AWS, Azure and GCP.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#151B26"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB07A"/>
      <stop offset="0.55" stop-color="#F0883E"/>
      <stop offset="1" stop-color="#B98CFF"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A371F7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A371F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0883E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F0883E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="400" rx="24"/></clipPath>
    <clipPath id="l1"><rect x="684" y="110" height="30" width="0"><animate attributeName="width" from="0" to="440" begin="0.5s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="684" y="140" height="30" width="0"><set attributeName="width" to="440" begin="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="684" y="170" height="30" width="0"><animate attributeName="width" from="0" to="440" begin="1.8s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="684" y="200" height="30" width="0"><set attributeName="width" to="440" begin="2.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="684" y="230" height="30" width="0"><animate attributeName="width" from="0" to="440" begin="3.1s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="684" y="260" height="30" width="0"><set attributeName="width" to="440" begin="4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="684" y="290" height="30" width="0"><set attributeName="width" to="440" begin="4.5s" fill="freeze"/></rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <circle cx="1060" cy="40" r="360" fill="url(#glowViolet)"/>
    <circle cx="80" cy="420" r="320" fill="url(#glowCoral)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Left: identity -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="64" y="92" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="16" letter-spacing="3" fill="#F0883E">SOFTWARE ARCHITECT · AI ENGINEER</text>
    <text x="62" y="168" font-size="64" font-weight="700" fill="url(#name)">Andrés Zapata</text>
    <text x="64" y="218" font-size="22" fill="#C9D1D9">Mission-critical platforms for Fintech &amp; Insurtech —</text>
    <text x="64" y="250" font-size="22" fill="#C9D1D9">and the <tspan fill="#E6EDF3" font-weight="600">AI agents</tspan> that help build them.</text>

    <g transform="translate(64 322)">
      <text font-size="36" font-weight="700" fill="#E6EDF3">10+</text>
      <text y="28" font-size="15" fill="#8B949E">years in software</text>
    </g>
    <line x1="220" y1="292" x2="220" y2="352" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <g transform="translate(244 322)">
      <text font-size="36" font-weight="700" fill="#E6EDF3">200+</text>
      <text y="28" font-size="15" fill="#8B949E">people led</text>
    </g>
    <line x1="380" y1="292" x2="380" y2="352" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <g transform="translate(404 322)">
      <text font-size="36" font-weight="700" fill="#E6EDF3">3 clouds</text>
      <text y="28" font-size="15" fill="#8B949E">AWS · Azure · GCP</text>
    </g>
  </g>

  <!-- Right: terminal -->
  <rect x="660" y="56" width="480" height="288" rx="14" fill="#0D1117" fill-opacity="0.92" stroke="#30363D"/>
  <circle cx="686" cy="80" r="6" fill="#FF5F57"/>
  <circle cx="706" cy="80" r="6" fill="#FEBC2E"/>
  <circle cx="726" cy="80" r="6" fill="#28C840"/>
  <text x="900" y="85" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#6E7681">~/andres</text>
  <line x1="660" y1="102" x2="1140" y2="102" stroke="#30363D"/>

  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="18">
    <text x="684" y="132" clip-path="url(#l1)"><tspan fill="#F0883E">$</tspan><tspan fill="#E6EDF3"> whoami</tspan></text>
    <text x="684" y="162" clip-path="url(#l2)" fill="#C9D1D9">architect · ai engineer · tech lead</text>
    <text x="684" y="192" clip-path="url(#l3)"><tspan fill="#F0883E">$</tspan><tspan fill="#E6EDF3"> ls ./ai</tspan></text>
    <text x="684" y="222" clip-path="url(#l4)" fill="#D2A8FF">agents/  mcp-servers/  skills/  training/</text>
    <text x="684" y="252" clip-path="url(#l5)"><tspan fill="#F0883E">$</tspan><tspan fill="#E6EDF3"> cat stack.txt</tspan></text>
    <text x="684" y="282" clip-path="url(#l6)" fill="#79C0FF">JVM · Kafka · K8s · AWS · Azure · GCP</text>
    <text x="684" y="312" clip-path="url(#l7)" fill="#F0883E">$</text>
  </g>
  <g visibility="hidden">
    <set attributeName="visibility" to="visible" begin="4.5s" fill="freeze"/>
    <rect x="706" y="296" width="10" height="20" fill="#E6EDF3">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
